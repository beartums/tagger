services:
  tggr:
    build: .
    container_name: tggr
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Mount your music library — change the left side to your actual path
      - /path/to/your/music:/music
      # Persists library.db and settings.json between restarts
      - tggr-config:/config
    environment:
      - TGGR_MUSIC_DIR=/music
      - TGGR_CONFIG_DIR=/config

volumes:
  tggr-config:
